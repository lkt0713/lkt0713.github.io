<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandpass 動畫檢視器</title>
<link rel="stylesheet" href="../../assets/theme.css?v=20260927c">
<script src="../../assets/site.js?v=20260927c"></script>
<style>
  main { max-width: 1060px; margin: 0 auto; padding: 24px 20px 40px;
         animation: fadeUp .5s ease-out .1s both; }

  .page-intro {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    padding: 22px 24px;
    margin-bottom: 20px;
  }
  .page-intro h1 {
    font-size: 1.35em; font-weight: 800; letter-spacing: -.4px;
    line-height: 1.35; color: var(--text);
    margin: 0 0 12px; padding-bottom: 13px;
    border-bottom: 2px solid var(--accent);
  }
  .page-intro .sub { color: var(--text-2); font-size: .88rem; line-height: 1.75; }
  .page-intro .sub b { color: var(--text); font-weight: 700; }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .tabs button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-2);
    padding: 9px 20px; border-radius: 0;
    font-size: .88rem; font-weight: 700; letter-spacing: .3px;
    cursor: pointer; transition: all .18s;
    box-shadow: var(--shadow); font-family: inherit;
  }
  .tabs button:hover { border-color: var(--accent); color: var(--accent); }
  .tabs button.active {
    background: var(--btn-bg); color: var(--on-btn); border-color: transparent;
    box-shadow: none;
  }

  .panel {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    padding: 22px 24px;
    transition: background .35s, border .35s;
  }
  .panel.active { display: block; }

  .imgwrap {
    position: relative; width: 100%; aspect-ratio: 1600 / 1236;
    background: var(--surface-2);
    border: 1px solid var(--border);
    /* pan-y（而非 none）：直向滑動交還瀏覽器捲頁，橫向滑動才拿來刷影格。
       用 none 的話手機在圖片上根本捲不動頁面。 */
    border-radius: 0; overflow: hidden; touch-action: pan-y;
  }
  .imgwrap img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    user-select: none; -webkit-user-drag: none;
  }
  .hint {
    position: absolute; top: 10px; right: 12px;
    font-size: .72rem; font-weight: 600; color: #fff;
    background: rgba(0,0,0,.82); backdrop-filter: blur(4px);
    padding: 5px 11px; border-radius: 0;
  }
  .controls { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }
  .row label {
    font-size: .69rem; text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-3); font-weight: 700; width: 76px; flex-shrink: 0;
  }
  input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
  .datebox {
    font-variant-numeric: tabular-nums; font-weight: 700;
    min-width: 118px; text-align: center;
    font-family: var(--mono); color: var(--text);
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 0; padding: 7px 12px;
  }
  .framebox {
    font-size: .75rem; color: var(--text-3); font-weight: 700;
    letter-spacing: .5px; min-width: 70px; text-align: right;
  }
  button.playbtn {
    padding: 9px 20px; border: 1px solid transparent; border-radius: 0;
    background: var(--btn-bg); color: var(--on-btn); cursor: pointer;
    font-size: .88rem; font-weight: 700; letter-spacing: .3px;
    font-family: inherit; box-shadow: none;
    transition: all .18s;
  }
  button.playbtn:hover { transform: translateY(-2px); box-shadow: none; }
  .speedval {
    min-width: 56px; text-align: right; font-size: .78rem;
    color: var(--text-3); font-weight: 700;
  }

  /* 提示文字依輸入裝置切換用詞（滑鼠 vs 觸控） */
  .hint-touch { display: none; }
  @media (pointer: coarse) {
    .hint-mouse { display: none; }
    .hint-touch { display: inline; }
  }

  /* ══════════ 手機版 ══════════ */
  @media (max-width: 640px) {
    main { padding: 18px 12px 36px; }
    .page-intro, .panel { padding: 16px 14px; }
    .page-intro h1 { font-size: 1.12em; line-height: 1.4; }
    .page-intro .sub { font-size: .85rem; }
    .tabs { gap: 6px; }
    .tabs button { flex: 1; padding: 9px 8px; font-size: .82rem; }
    .hint { font-size: .66rem; top: 8px; right: 8px; padding: 4px 8px; }
    .controls { gap: 14px; }
    .row { gap: 8px; }
    .row label { width: 100%; }
    .frame-slider { flex: 1 1 100%; min-width: 0; }
    .speed-slider { flex: 1 1 55%; min-width: 110px; }
    .datebox { flex: 1; min-width: 0; padding: 7px 8px; font-size: .85rem; }
    .framebox { min-width: 0; }
    button.playbtn { flex: 1 1 100%; padding: 12px 20px; }
  }
</style>
</head>
<body data-page-title="Bandpass 動畫檢視器"

<main>
<div class="page-intro">
  <h1>Bandpass 動畫檢視器 — 滾輪 / 拖曳調整時間與速度</h1>
  <div class="sub">
    直接在圖片上<b>滾動滑鼠滾輪</b>或<b>左右拖曳</b>即可刷過時間軸，也可用下方播放鍵自動播放並調整速度。<br>
    切換上方頁籤可比較 <b>10–30 天</b>與 <b>30–90 天</b>兩種帶通濾波尺度下的訊號演變。
  </div>
</div>
<div class="tabs">
  <button data-target="panel-1030" class="active">10-30 天濾波</button>
  <button data-target="panel-3090">30-90 天濾波</button>
</div>

<div class="panel active" id="panel-1030">
  <div class="imgwrap">
    <img src="" alt="10-30 天濾波 (bp13)">
    <div class="hint"><span class="hint-mouse">滾輪或拖曳圖片可切換影格</span><span class="hint-touch">左右滑動圖片可切換影格</span></div>
  </div>
  <div class="controls">
    <div class="row">
      <label>時間軸</label>
      <input type="range" class="frame-slider" min="0" max="50" value="0" step="1">
      <span class="datebox"></span>
      <span class="framebox"></span>
    </div>
    <div class="row">
      <button class="playbtn">播放</button>
      <label style="width:auto;">速度</label>
      <input type="range" class="speed-slider" min="1" max="30" value="6" step="1">
      <span class="speedval">6 fps</span>
    </div>
  </div>
</div>
<div class="panel " id="panel-3090">
  <div class="imgwrap">
    <img src="" alt="30-90 天濾波 (bp39)">
    <div class="hint"><span class="hint-mouse">滾輪或拖曳圖片可切換影格</span><span class="hint-touch">左右滑動圖片可切換影格</span></div>
  </div>
  <div class="controls">
    <div class="row">
      <label>時間軸</label>
      <input type="range" class="frame-slider" min="0" max="153" value="0" step="1">
      <span class="datebox"></span>
      <span class="framebox"></span>
    </div>
    <div class="row">
      <button class="playbtn">播放</button>
      <label style="width:auto;">速度</label>
      <input type="range" class="speed-slider" min="1" max="30" value="6" step="1">
      <span class="speedval">6 fps</span>
    </div>
  </div>
</div>
</main>

function initPanel(key) {
  const d = DATASETS[key];
  const panel = document.getElementById('panel-' + key);
  const img = panel.querySelector('img');
  const slider = panel.querySelector('.frame-slider');
  const dateBox = panel.querySelector('.datebox');
  const frameBox = panel.querySelector('.framebox');
  const playBtn = panel.querySelector('.playbtn');
  const speedSlider = panel.querySelector('.speed-slider');
  const speedVal = panel.querySelector('.speedval');
  const wrap = panel.querySelector('.imgwrap');

  let idx = 0;
  let playing = false;
  let timer = null;

  function render() {
    img.src = d.dir + '/' + d.files[idx];
    dateBox.textContent = d.dates[idx];
    frameBox.textContent = (idx + 1) + ' / ' + d.files.length;
    slider.value = idx;
  }

  function setIdx(newIdx) {
    idx = ((newIdx % d.files.length) + d.files.length) % d.files.length;
    render();
  }

  function fps() { return Number(speedSlider.value); }

  function play() {
    if (timer) clearInterval(timer);
    timer = setInterval(() => setIdx(idx + 1), 1000 / fps());
    playing = true;
    playBtn.textContent = '暫停';
  }
  function pause() {
    if (timer) clearInterval(timer);
    playing = false;
    playBtn.textContent = '播放';
  }

  playBtn.addEventListener('click', () => playing ? pause() : play());

  slider.addEventListener('input', () => {
    pause();
    setIdx(Number(slider.value));
  });

  speedSlider.addEventListener('input', () => {
    speedVal.textContent = fps() + ' fps';
    if (playing) play();
  });

  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    pause();
    setIdx(idx + (e.deltaY > 0 ? 1 : -1));
  }, { passive: false });

  // drag to scrub
  let dragging = false;
  let dragStartX = 0;
  let dragStartIdx = 0;
  wrap.addEventListener('pointerdown', (e) => {
    dragging = true;
    pause();
    dragStartX = e.clientX;
    dragStartIdx = idx;
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - dragStartX;
    const framesPerPixel = 1 / 8;
    setIdx(dragStartIdx + Math.round(dx * framesPerPixel));
  });
  wrap.addEventListener('pointerup', () => dragging = false);
  wrap.addEventListener('pointercancel', () => dragging = false);

  render();
}

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.target).classList.add('active');
  });
});

Object.keys(DATASETS).forEach(initPanel);
